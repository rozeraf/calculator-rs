[package]
name = "calc-v2"
version = "2.0.0"
edition = "2021"

[[bin]]
name = "calc"
path = "src/main.rs"

[dependencies]
num-bigint = "0.4"
num-traits  = "0.2"
num-integer = "0.1"
rustyline    = "14"

[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
strip         = "symbols"
panic         = "abort"
